name: 🧪 Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: 🔬 Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build (bundle check)
        run: npm run build
