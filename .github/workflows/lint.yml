name: 🍞 Lint

on: [pull_request]

jobs:
  markdownlint:
    name: 🥐 Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🚀 Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g markdownlint-cli@0.45.0
      - run: markdownlint '**/*.md' --ignore node_modules --ignore dist
